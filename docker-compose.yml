version: "3.8"

services:
  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: medapp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medapp-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME:-medapp}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-medapppass}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-medapp}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Consul Service Discovery
  consul:
    image: consul:1.15.4
    container_name: medapp-consul
    ports:
      - "8500:8500" # UI and API
      - "8600:8600/udp" # DNS interface
    volumes:
      - consul_data:/consul/data
    networks:
      - medapp-network
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"

  # Service Registry
  service-registry:
    build:
      context: ./backend/registry
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - medapp-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RabbitMQ Service
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: medapp-rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - medapp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2
    container_name: medapp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: medapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - medapp-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:10.1.0
    container_name: medapp-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - medapp-network
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:0.84.0
    container_name: medapp-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Prometheus metrics exposed by the collector
      - "8889:8889" # Prometheus exporter metrics
    networks:
      - medapp-network
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--tries=1", "http://localhost:13133/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Mobile Gateway
  mobile-gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: medapp-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGODB_USERNAME:-medapp}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-medapppass}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-medapp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      service-registry:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - medapp-network
    volumes:
      - ./backend/gateway:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # X-Ray Service
  xray-service:
    build:
      context: ./backend/services/xray
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=8081
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGODB_USERNAME:-medapp}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-medapppass}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-medapp}
    depends_on:
      - service-registry
      - consul
      - redis
      - rabbitmq
      - mongodb
    networks:
      - medapp-network
    volumes:
      - ./backend/services/xray:/app
      - /app/node_modules
      - xray_models:/app/models
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Knowledge Service
  knowledge-service:
    build:
      context: ./backend/services/knowledge
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=8082
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=${MONGODB_USERNAME:-medapp}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-medapppass}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-medapp}
    depends_on:
      - service-registry
      - consul
      - redis
      - rabbitmq
      - mongodb
    networks:
      - medapp-network
    volumes:
      - ./backend/services/knowledge:/app
      - /app/node_modules
      - ./backend/medical_corpus:/app/medical_corpus
      - ./backend/services/knowledge/chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flutter Development Server
  flutter-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8888:8888" # Flutter web dev server
      - "42000:42000" # Flutter debug port
    environment:
      - MEDAPP_API_URL=http://mobile-gateway:5000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - ./frontend:/app
      - flutter-pub-cache:/root/.pub-cache
    depends_on:
      - mobile-gateway
    networks:
      - medapp-network

networks:
  medapp-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data:
  xray_models:
  flutter-pub-cache:
  consul_data:
