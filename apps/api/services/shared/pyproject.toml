[project]
name = "pulmocare-shared"
version = "0.1.0"
description = "Shared utilities and common modules for PulmoCare microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI and web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    
    # OpenTelemetry - Tracing, Metrics, Logging
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation>=0.46b0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-requests>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "opentelemetry-instrumentation-pymongo>=0.46b0",
    "opentelemetry-semantic-conventions>=0.46b0",
    
    # Metrics
    "prometheus-client>=0.20.0",
    
    # Message Queue
    "pika>=1.3.2",
    "aio-pika>=9.4.0",
    
    # Caching
    "redis>=5.0.0",
    "aioredis>=2.0.1",
    
    # Database
    "pymongo>=4.7.0",
    
    # Configuration and Environment
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    
    # Service Discovery
    "python-consul>=1.1.0",
    
    # Utilities
    "tenacity>=8.3.0",
    "structlog>=24.2.0",

    # Observability: error tracking + request correlation IDs
    "sentry-sdk[fastapi]>=2.20.0",
    "asgi-correlation-id>=4.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulmocare_shared"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "PL",     # pylint
    "RUF",    # ruff-specific
]

ignore = [
    "S101",     # assert allowed in tests
    "PLR2004",  # magic value comparison
    "S104",     # possible binding to all interfaces
    "B008",     # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["pulmocare_shared"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
