[project]
name = "patients-service"
version = "1.0.0"
description = "PulmoCare Patients Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Shared module (editable install)
    "pulmocare-shared",
    "email-validator>=2.0.0",  # required by pydantic EmailStr in patient models
]

[tool.uv.sources]
pulmocare-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "PL",     # pylint
    "RUF",    # ruff-specific
]

ignore = [
    "S101",     # assert allowed in tests
    "PLR2004",  # magic value comparison
    "S104",     # possible binding to all interfaces
    "B008",     # function call in default argument (FastAPI Depends)
    # --- Acknowledged legacy tech debt (ratchet down over time) ---
    # Disabled (NOT swallowed with `|| echo`) so `ruff check` runs for real and
    # blocks *new* violations while existing debt is tracked here.
    "T201",     # print used as logging
    "BLE001",   # blind except Exception
    "B904",     # raise ... from err inside except
    "B007",     # unused loop control variable
    "DTZ003",   # datetime.utcnow (migrate to timezone-aware)
    "PLW0108",  # unnecessary lambda
    "PLR0912",  # too many branches
    "PLC0415",  # import outside top level
    "S108",     # hardcoded /tmp path (export dir)
    "E501",     # long log strings
]

[tool.ruff.lint.per-file-ignores]
# Test code: late/local imports and fixture wiring are intentional.
"tests/**" = ["S105", "S106", "PLC0415", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["pulmocare_shared"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false