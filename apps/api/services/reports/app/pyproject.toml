[project]
name = "reports-service"
version = "1.0.0"
description = "PulmoCare Reports Service with AI/ML capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Shared module (editable install)
    "pulmocare-shared",
    
    # AI/ML and LangChain
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.4.0",
    "nltk>=3.9.0",
    "scikit-learn>=1.5.0",
    
    # Document processing
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.8",
    "pypdf2>=2.0.0",
    "pdfkit>=1.0.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.9.3",
    "lxml>=5.0.0",
    
    # Data processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    
    # Additional utilities
    "python-magic>=0.4.27",
    "aiofiles>=24.1.0",
    "schedule>=1.1.0",

    # AI narrative step (claude-haiku-4-5) for the radiology-report endpoint
    "anthropic>=0.40.0",
    "email-validator>=2.0.0",
]

[tool.uv.sources]
pulmocare-shared = { path = "../../shared", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "PL",     # pylint
    "RUF",    # ruff-specific
]

ignore = [
    "S101",     # assert allowed in tests
    "PLR2004",  # magic value comparison
    "S104",     # possible binding to all interfaces
    "B008",     # function call in default argument (FastAPI Depends)
    "S602",     # subprocess calls (needed for PDF generation)
    "S603",     # subprocess without shell
    # --- Acknowledged legacy tech debt (ratchet down over time) ---
    # The new AI radiology files pass the full strict ruleset; these disable
    # documented pre-existing debt in the older service code so `ruff check`
    # runs for real (NOT swallowed with `|| echo`) and blocks new violations.
    "T201",     # print used as logging
    "BLE001",   # blind except Exception
    "B904",     # raise ... from err inside except
    "DTZ003",   # datetime.utcnow
    "DTZ005",   # datetime.now without tz
    "S311",     # non-crypto random (report IDs, demo data)
    "S108",     # hardcoded /tmp export path
    "S113",     # requests without timeout
    "F821",     # undefined name (legacy star-import usage)
    "E402",     # late import (consumer started in __main__)
    "E501",     # long log strings
    "RUF013",   # implicit Optional
    "UP042",    # str enum
    "ASYNC210", # blocking http in async (legacy scraper)
    "C403",     # list comp -> set comp
    "W293",     # whitespace on blank lines inside multiline strings
    "RUF012",   # mutable class default (legacy dataclass-ish classes)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLC0415", "PLR2004", "SLF001", "PLW0108", "RUF012"]
# radiology_service intentionally calls MedRAX tools' protected _run(), lazily
# imports torch-backed tools, caches them via module globals, and degrades on
# broad exceptions when weights are missing.
"services/radiology_service.py" = ["SLF001", "BLE001", "PLC0415", "PLW0603"]

[tool.ruff.lint.isort]
known-first-party = ["pulmocare_shared"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
