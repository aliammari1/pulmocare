<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A medical application for report management and analysis">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MedApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Permission policy for modern browsers including Edge -->
  <meta http-equiv="Permissions-Policy" content="microphone=(), camera=()">
  
  <!-- Permissions for Edge and other browsers -->
  <meta name="permissions" content="microphone; audio-capture; speech-recognition">

  <title>MedApp</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Explicitly request permissions on page load for Edge
    window.addEventListener('load', async function() {
      try {
        if (navigator.permissions && navigator.permissions.query) {
          const micPermission = await navigator.permissions.query({ name: 'microphone' });
          console.log('Microphone permission status:', micPermission.state);
          
          // If permission is prompt, request it early
          if (micPermission.state === 'prompt') {
            await navigator.mediaDevices.getUserMedia({ audio: true });
          }
        }
      } catch (e) {
        console.warn('Permission check failed:', e);
      }
    });
  </script>

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
