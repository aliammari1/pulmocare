name: medapp
description: Medical X-Ray Analysis App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  photo_view: ^0.14.0
  flutter_spinkit: ^5.2.0
  fl_chart: ^0.65.0
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  file_saver: ^0.2.9
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.18.0
  uuid: ^4.2.1
  # Added for microservices architecture
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  dart_amqp: ^0.3.1
  rxdart: ^0.27.7
  get_it: ^7.6.4
  injectable: ^2.3.2
  flutter_bloc: ^8.1.3
  auto_route: ^7.8.4
  flutter_dotenv: ^5.1.0
  logging: ^1.2.0
  retry: ^3.1.2
  flutter_offline: ^3.0.1
  cached_network_image: ^3.3.0
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.3
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  retrofit_generator: ^7.0.8
  json_serializable: ^6.7.1
  freezed: ^2.4.5
  injectable_generator: ^2.4.1
  auto_route_generator: ^7.3.2
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
