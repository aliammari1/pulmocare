name: medapp
description: Medical Imaging Analysis Platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  photo_view: ^0.15.0
  flutter_spinkit: ^5.2.0
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  file_saver: ^0.2.9
  permission_handler: ^11.0.1
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^10.0.0-beta.4
  intl: ^0.20.2
  uuid: ^4.2.1
  # Added for microservices architecture
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  freezed_annotation: ^3.0.0
  dart_amqp: ^0.3.1
  rxdart: ^0.28.0
  get_it: ^8.0.3
  injectable: ^2.3.2
  flutter_bloc: ^9.1.0
  auto_route: ^10.0.1
  flutter_dotenv: ^5.1.0
  logging: ^1.2.0
  retry: ^3.1.2
  flutter_offline: ^4.0.0
  cached_network_image: ^3.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  http_parser: ^4.0.2
  cupertino_icons: ^1.0.2
  network_info_plus: ^5.0.1
  sqflite: ^2.3.0
  pdf: ^3.10.4
  open_file: ^3.3.2
  share_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  retrofit_generator: ^9.1.9
  json_serializable: ^6.7.1
  freezed: ^3.0.3
  injectable_generator: ^2.4.1
  auto_route_generator: ^10.0.1
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
